name: CI

on:
    pull_request:
        branches:
            - dev
            - main
    push:
        branches:
            - dev

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            
            - name: Install dependencies
              run: |
                pip install -r docker/requirements.txt
                pip install pytest ruff mypy
            
            - name: Lint (ruff)
              run: ruff check .
            
            - name: Type check (mypy)
              run: mypy .

            - name: Run tests
              run: pytest -q